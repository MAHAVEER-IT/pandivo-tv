<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Ceramic Badge Gradient -->
    <linearGradient id="crestSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Note Body Gradient: Deep Obsidian Slate to Royal Iris -->
    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="70%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Wave 1: Royal Iris to Electric Violet -->
    <linearGradient id="wave1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Wave 2: Royal Iris Harmonic -->
    <linearGradient id="wave2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A5B4FC" />
    </linearGradient>

    <!-- Wave 3: Radiant Cyan Overtone -->
    <linearGradient id="wave3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Elevation Soft Shadow Filter -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#6366F1" flood-opacity="0.26" />
    </filter>
  </defs>

  <!-- Layer 1: Ceramic Badge Surface with Soft Shadow -->
  <rect x="36" y="36" width="440" height="440" rx="126" fill="url(#crestSurface)" stroke="#6366F1" stroke-width="12" filter="url(#badgeShadow)" />
  <!-- Inner Acoustic Precision Ring -->
  <rect x="58" y="58" width="396" height="396" rx="108" fill="none" stroke="#6366F1" stroke-width="2.5" stroke-opacity="0.22" />

  <!-- Layer 2: Tilted Musical Note Head -->
  <g transform="translate(192, 332) rotate(-26)">
    <!-- Base Note Head -->
    <ellipse cx="0" cy="0" rx="66" ry="50" fill="#0F172A" />
    <!-- Inner Harmonic Core Droplet -->
    <ellipse cx="0" cy="0" rx="28" ry="20" fill="url(#wave1Grad)" />
    <!-- Specular Acoustic Sparkle -->
    <circle cx="-6" cy="-4" r="6" fill="#FFFFFF" opacity="0.85" />
  </g>

  <!-- Layer 3: Vertical Note Stem with Smooth Iris Transition -->
  <path d="M 238 312 L 238 152 Q 238 128 260 128 L 292 128" 
        fill="none" stroke="url(#stemGrad)" stroke-width="25" stroke-linecap="round" />

  <!-- Layer 4: 3 Radiating Dynamic Acoustic Soundwaves (Frequencies from Note Flag) -->
  <!-- Wave 1 (Upper primary soundwave arc) -->
  <path d="M 290 128 C 366 128 402 178 402 242" 
        fill="none" stroke="url(#wave1Grad)" stroke-width="24" stroke-linecap="round" />

  <!-- Wave 2 (Middle harmonic soundwave arc) -->
  <path d="M 290 180 C 344 180 370 215 370 262" 
        fill="none" stroke="url(#wave2Grad)" stroke-width="19" stroke-linecap="round" />

  <!-- Wave 3 (Inner overtone soundwave arc) -->
  <path d="M 290 230 C 324 230 340 252 340 280" 
        fill="none" stroke="url(#wave3Grad)" stroke-width="15" stroke-linecap="round" />

  <!-- Layer 5: Acoustic Particle / Intelligence Node -->
  <circle cx="400" cy="302" r="9" fill="#6366F1" />
  <circle cx="400" cy="302" r="4" fill="#FFFFFF" />
</svg>